<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Nos perdonas?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        .buttons-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
            position: relative;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .yes-btn {
            background-color: #4CAF50;
            color: white;
        }

        .yes-btn:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        .no-btn {
            background-color: #f44336;
            color: white;
            position: relative;
        }

        .no-btn:hover {
            background-color: #da190b;
        }

        .no-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        .success-message {
            font-size: 2em;
            color: #4CAF50;
            margin-top: 30px;
        }

        .final-message {
            font-size: 1.4em;
            color: #764ba2;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">¿Nos perdonas?</h1>
        
        <div id="buttonsDiv" class="buttons-container">
            <button class="yes-btn" id="yesBtn">Sí</button>
            <button class="no-btn" id="noBtn">No</button>
        </div>

        <div id="messageDiv"></div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const buttonsDiv = document.getElementById('buttonsDiv');
        const messageDiv = document.getElementById('messageDiv');
        const title = document.getElementById('title');

        let noClickCount = 0;
        let escapeActive = false;

        yesBtn.addEventListener('click', function() {
            buttonsDiv.classList.add('hidden');
            title.classList.add('hidden');
            
            messageDiv.innerHTML = '<div class="success-message">¡Gracias chiquito! 💕</div>';
            
            setTimeout(() => {
                messageDiv.innerHTML += '<div class="final-message">El viernes te invito a una fiesta 🎉</div>';
            }, 1000);
        });

        noBtn.addEventListener('click', function(e) {
            if (noBtn.disabled) return;
            
            noClickCount++;
            
            if (noClickCount === 1) {
                // Primera vez: se mueve hacia la izquierda
                escapeActive = true;
                noBtn.style.position = 'absolute';
                noBtn.style.transition = 'all 0.6s ease-in-out';
                noBtn.style.transform = 'translateX(-250px)';
                
                setTimeout(() => {
                    noBtn.style.transform = 'translateX(0)';
                    escapeActive = false;
                }, 700);
            } 
            else if (noClickCount === 2) {
                // Segunda vez: se mueve a posición aleatoria
                noBtn.style.position = 'fixed';
                noBtn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
                noBtn.style.top = Math.random() * (window.innerHeight - 100) + 'px';
            }
            else if (noClickCount === 3) {
                // Tercera vez: otra posición aleatoria
                noBtn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
                noBtn.style.top = Math.random() * (window.innerHeight - 100) + 'px';
            }
            else {
                // Después: se desactiva
                noBtn.disabled = true;
                noBtn.style.opacity = '0.5';
                noBtn.textContent = 'No puedes';
            }
        });
    </script>
</body>
</html>
